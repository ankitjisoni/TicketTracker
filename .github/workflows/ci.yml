name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: |
          node -c server.js
          node -c src/ado-client.js
          node -c src/db.js
          node -c src/poller.js
          node -c src/routes.js
          node -c public/js/app.js
          node -c public/js/ui.js
